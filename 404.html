<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sebastián Carrera Moya</title>
    <script>
      // GitHub Pages + SPA: envía la ruta como query a "/" y index.html la restaura.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
